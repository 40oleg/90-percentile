<div class="screen">
  <header class="header">
    <div class="title-row">
      <h1 class="title">
        <span class="title-90">90</span>
        <span class="title-rest">PERCENTILE</span>
      </h1>
      <button
        type="button"
        class="mute-btn"
        (click)="onMuteToggle()"
        [attr.aria-pressed]="sound.muted()"
        [attr.aria-label]="sound.muted() ? 'Включить звук' : 'Выключить звук'"
      >
        {{ sound.muted() ? '🔇' : '🔊' }}
      </button>
    </div>

    <p class="subtitle">Стань сильнее и быстрее 90% людей на планете</p>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="state.percentile()"></div>
      </div>
      <span class="progress-label">
        {{ state.completedCount() }}/{{ state.total }} · {{ state.percentile() }}%
      </span>
    </div>
  </header>

  <app-filter-bar [active]="state.filter()" (changed)="onFilterChange($event)" />

  <main class="list">
    @for (challenge of state.visibleChallenges(); track challenge.id) {
      <app-challenge-card
        [challenge]="challenge"
        [completed]="state.isCompleted(challenge.id)"
        (toggled)="onToggle($event)"
      />
    } @empty {
      <p class="empty">Ничего не найдено для этого фильтра.</p>
    }
  </main>
</div>
